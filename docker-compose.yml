services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  db-initializer:
    image: postgres:15-alpine
    container_name: db-initializer
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      PGPASSWORD: app_password
    volumes:
      - ./schema_analytics.sql:/db/schema_analytics.sql:ro
      - ./migrations:/db/migrations:ro
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      set -eu;
      until pg_isready -h postgres-db -U app_user -d appdb; do
        echo "Waiting for postgres-db...";
        sleep 2;
      done;
      psql -v ON_ERROR_STOP=1 -h postgres-db -U app_user -d appdb -f /db/schema_analytics.sql;
      for migration in /db/migrations/*.sql; do
        echo "Applying $${migration}";
        psql -v ON_ERROR_STOP=1 -h postgres-db -U app_user -d appdb -f "$${migration}";
      done
    restart: "no"

  redis-queue:
    image: redis:7-alpine
    container_name: redis-queue
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
